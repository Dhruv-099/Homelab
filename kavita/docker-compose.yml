services:
  kavita:
    image: jvmilazz0/kavita:latest
    container_name: kavita
    restart: unless-stopped
    environment:
      TZ: Asia/Kolkata
    volumes:
      - ./config:/kavita/config
      - type: bind
        source: ${KAVITA_BOOKS_DIR}
        target: /books
        bind:
          create_host_path: false
    ports:
      - 5001:5000
    networks:
      - homelab

networks:
  homelab:
    external: true
