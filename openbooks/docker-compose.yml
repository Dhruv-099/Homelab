services:
  openbooks:
    image: evanbuss/openbooks:latest
    container_name: openbooks
    restart: unless-stopped
    ports:
      - "8094:80"
    volumes:
      # Mount Kavita's book library from host storage. Use `${KAVITA_BOOKS_DIR}` in
      # `.env` to avoid exposing host paths in the repo.
      - type: bind
        source: ${KAVITA_BOOKS_DIR}
        target: /books
        bind:
          create_host_path: false
    # Server name shown to connecting clients: set your own in `.env` if you'd rather not hardcode it
    command: --name homelab --persist --dir /books
    environment:
      - BASE_PATH=/
    networks:
      - homelab

networks:
  homelab:
    external: true
