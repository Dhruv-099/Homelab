services:
  nextcloud:
    image: nextcloud:latest
    container_name: nextcloud
    restart: unless-stopped
    labels:
      # Auto-run Nextcloud's upgrade routine after Watchtower updates the image
      - "com.centurylinklabs.watchtower.lifecycle.post-update=su -s /bin/sh www-data -c 'php /var/www/html/occ maintenance:mode --on && php /var/www/html/occ upgrade && php /var/www/html/occ maintenance:mode --off'"
    environment:
      # IMPORTANT: Use `.env` for real secrets. See .env.example and SECURITY.md.
      - POSTGRES_HOST=nextcloud_db
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=nextcloud
      - POSTGRES_PASSWORD=${NEXTCLOUD_DB_PASSWORD}
      - NEXTCLOUD_ADMIN_USER=admin
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
      # Trusted domain: set in your local `.env` (do not commit real domains)
      - NEXTCLOUD_TRUSTED_DOMAINS=${NEXTCLOUD_TRUSTED_DOMAIN}
      - OVERWRITEPROTOCOL=https
      - OVERWRITECLIURL=https://${NEXTCLOUD_TRUSTED_DOMAIN}
      # Reverse proxy (NPM) sits on the Docker network; trust it for client IP/HTTPS headers
      - TRUSTED_PROXIES=172.16.0.0/12
    volumes: &nextcloud-volumes
      # Nextcloud code. A named volume (not anonymous) so the cron container
      # can mount it directly and survive Watchtower recreating either one.
      - html:/var/www/html
      - ./config:/var/www/html/config
      - ./custom_apps:/var/www/html/custom_apps
      - ./themes:/var/www/html/themes
      # Persistent Nextcloud data. Use an env var to avoid exposing host layout.
      - type: bind
        source: ${NEXTCLOUD_DATA_DIR}
        target: /var/www/html/data
        bind:
          create_host_path: false
    ports:
      - 8088:80
    depends_on:
      - nextcloud_db
    networks:
      - homelab
      - nextcloud

  nextcloud_cron:
    # Runs Nextcloud background jobs every 5 minutes (shares volumes with the app)
    image: nextcloud:latest
    container_name: nextcloud_cron
    restart: unless-stopped
    entrypoint: /cron.sh
    # Same code, config and data volumes as the app container. Not
    # volumes_from: Watchtower can't recreate a container that references
    # another container's ID, so it breaks on every Nextcloud update.
    volumes: *nextcloud-volumes
    depends_on:
      - nextcloud
    networks:
      - nextcloud

  nextcloud_db:
    image: postgres:16
    container_name: nextcloud_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=nextcloud
      - POSTGRES_PASSWORD=${NEXTCLOUD_DB_PASSWORD}
    volumes:
      - ./db:/var/lib/postgresql/data
    networks:
      - nextcloud

volumes:
  html:
    name: nextcloud_html

networks:
  homelab:
    external: true
  nextcloud:
    name: nextcloud_network
