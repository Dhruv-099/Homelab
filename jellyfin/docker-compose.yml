services:
  jellyfin:
    container_name: jellyfin
    image: ghcr.io/hotio/jellyfin:latest
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Asia/Kolkata
    ports:
      - 8096:8096
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ~/jellyfin/config:/config
      # Storage for media files (read-only). Use `${MEDIA_DIR}` in `.env`.
      - type: bind
        source: ${MEDIA_DIR}
        target: /data
        read_only: true
        bind:
          create_host_path: false
    networks:
      - homelab

networks:
  homelab:
    external: true
