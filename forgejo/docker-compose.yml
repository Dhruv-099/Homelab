networks:
  homelab:
    external: true
  forgejo:
    external: false

services:
  server:
    image: codeberg.org/forgejo/forgejo:14
    container_name: forgejo
    environment:
      # Runtime user IDs inside the container. Usually safe to keep, but
      # don't expose admin credentials here; use `.env` for sensitive values.
      - USER_UID=1001
      - USER_GID=1001
      # Point Forgejo at the bundled Postgres so the install wizard is pre-filled
      - FORGEJO__database__DB_TYPE=postgres
      - FORGEJO__database__HOST=db:5432
      - FORGEJO__database__NAME=forgejo
      - FORGEJO__database__USER=forgejo
      - FORGEJO__database__PASSWD=${FORGEJO_DB_PASSWORD}
      - FORGEJO__database__SSL_MODE=disable
      # Public URL: set in your local `.env` (do not commit real domains)
      - FORGEJO__server__ROOT_URL=${FORGEJO_ROOT_URL}
      # SSH: container port 22 is published on host port 222 (see ports below)
      - FORGEJO__server__SSH_PORT=222
      - FORGEJO__server__SSH_LISTEN_PORT=22
      - FORGEJO__service__DEFAULT_KEEP_EMAIL_PRIVATE=true
    restart: always
    networks:
      - homelab
      - forgejo
    volumes:
      # Container data directory: contains repositories and config — set via
      # `.env` and do not commit actual repo data.
      - ${FORGEJO_DATA_DIR}:/data
      # Sync host timezone (read-only). Fine to keep but exposes host timezone.
      - /etc/localtime:/etc/localtime:ro
    ports:
      - '3000:3000'
      - '222:22'
  db:
    image: postgres:15-alpine
    container_name: forgejo_db
    restart: always
    environment:
      # Database credentials: DO NOT commit plaintext passwords. Use an
      # external `.env` or Docker secrets and add `.env` to .gitignore.
      - POSTGRES_USER=forgejo
      - POSTGRES_PASSWORD=${FORGEJO_DB_PASSWORD}
      - POSTGRES_DB=forgejo
    networks:
      - forgejo
    volumes:
      # Postgres data directory. Set via `.env` to avoid revealing host layout.
      - ${FORGEJO_PGDATA_DIR}:/var/lib/postgresql/data
