services:
  homarr:
    container_name: homarr
    image: ghcr.io/homarr-labs/homarr:latest
    restart: unless-stopped
    ports:
      - 7575:7575
    volumes:
      # Read-only socket so Homarr can list containers for the Docker integration
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # DB_URL points at /appdata/db/db.sqlite (SQLite) — persist it on the host.
      # NOTE: /app/db is intentionally NOT mounted: the image bundles its DB
      # migrations there, and any mount (bind or seeded volume) hides or stale-
      # copies them. Migrations live with the image, data lives here.
      - ./data/appdata/db:/appdata/db
      - ./data/appdata/redis:/appdata/redis
      - ./data/appdata/trusted-certificates:/appdata/trusted-certificates
      - ./data/appdata/configs:/app/data/configs
      - ./data/appdata/certificates:/app/data/certificates
      - ./data/appdata/icons:/app/data/icons
      - ./data/appdata/fonts:/app/data/fonts
      - ./data/appdata/keycloak:/app/data/keycloak
      - ./data/appdata/log:/app/log
    environment:
      # Required: encrypts board secrets in the DB. From `openssl rand -hex 32`.
      SECRET_ENCRYPTION_KEY: ${HOMARR_SECRET_ENCRYPTION_KEY}
    networks:
      - homelab

networks:
  homelab:
    external: true
