services:
  notifier:
    # Built locally (deps baked in); rebuild after changes with `docker compose up -d --build`
    build: .
    image: homelab-notifier:local
    container_name: homelab-notifier
    restart: unless-stopped
    volumes:
      # Shared alert queue (SQLite, written by the inbox, drained by the notifier)
      - ./data:/data
    environment:
      - PYTHONUNBUFFERED=1
      - ALERT_DB=/data/alerts.db
      # Override only to test delivery retries (point at a dead host)
      - TELEGRAM_API_BASE=${TELEGRAM_API_BASE:-https://api.telegram.org}
      # Warn if Scrutiny gets no SMART report for this many hours (Proxmox collector cron died)
      - SCRUTINY_URL=http://scrutiny:8080
      - DEADMAN_HOURS=${DEADMAN_HOURS:-12}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - BESZEL_URL=${BESZEL_URL}
      - BESZEL_EMAIL=${BESZEL_EMAIL}
      - BESZEL_PASSWORD=${BESZEL_PASSWORD}
      # Send an "all good" summary after every 6-hourly check (set false for alerts only)
      - SEND_OK_SUMMARY=${SEND_OK_SUMMARY:-true}
      - ROOT_DISK_LABEL=${ROOT_DISK_LABEL:-Root}
    labels:
      # Locally built image — nothing for Watchtower to pull
      - "com.centurylinklabs.watchtower.enable=false"
    networks:
      - homelab

  inbox:
    # Webhook receiver for Watchtower and Scrutiny: only writes to the alert queue, so it
    # stays up (and rarely changes) while the notifier is rebuilt or Telegram is unreachable
    image: homelab-notifier:local
    container_name: homelab-inbox
    command: ["python", "-u", "inbox.py"]
    restart: unless-stopped
    ports:
      - "7440:8000"
    environment:
      - ALERT_DB=/data/alerts.db
    volumes:
      - ./data:/data
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    networks:
      - homelab

networks:
  homelab:
    external: true
