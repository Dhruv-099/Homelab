services:
  notifier:
    # Built locally (deps baked in); rebuild after changes with `docker compose up -d --build`
    build: .
    image: homelab-notifier:local
    container_name: homelab-notifier
    restart: unless-stopped
    ports:
      - "7440:8000"
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - BESZEL_URL=${BESZEL_URL}
      - BESZEL_EMAIL=${BESZEL_EMAIL}
      - BESZEL_PASSWORD=${BESZEL_PASSWORD}
      # Send an "all good" summary after every 6-hourly check (set false for alerts only)
      - SEND_OK_SUMMARY=${SEND_OK_SUMMARY:-true}
      - ROOT_DISK_LABEL=${ROOT_DISK_LABEL:-Root}
    labels:
      # Locally built image — nothing for Watchtower to pull
      - "com.centurylinklabs.watchtower.enable=false"
    networks:
      - homelab

networks:
  homelab:
    external: true
